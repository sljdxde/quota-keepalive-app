<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    }
  })();
</script>
<link rel="stylesheet" href="assets/qka-ui.css">
<link rel="stylesheet" href="assets/ball.css">
<style>
  /* 拖动区域必须写在页面里（Wails 读取计算样式）：球体可拖，内部图标/数字
     不参与拖动，点击仍冒泡到 #ball。 */
  #ball { --wails-draggable: drag; }
  #ball .ring, #ball .core { --wails-draggable: no-drag; pointer-events: none; }
</style>
</head>
<body>
  <!-- 常驻悬浮球：Windows 上等价于 macOS 菜单栏上的 QKA 状态项。
       窗口本身已被 shapeBarWindow 裁成正圆，这里铺满并画卡片底；
       按住可拖动（--wails-draggable），单击弹精简面板，右键出菜单。
       拖到屏幕左右边缘会收成 44px 半圆（Go 侧 SetSize），此时只显示 Q。 -->
  <div id="ball" class="ball idle" role="button" aria-haspopup="dialog" title="Quota Keepalive">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="ring-gradient" x1="8" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
          <stop offset="0" style="stop-color:hsl(var(--ball-hue, 193) 92% 66%)"></stop>
          <stop offset="1" style="stop-color:hsl(calc(var(--ball-hue, 193) + 55) 92% 70%)"></stop>
        </linearGradient>
      </defs>
      <circle class="track" cx="32" cy="32" r="30.5"></circle>
      <circle class="bar" cx="32" cy="32" r="30.5" stroke-dasharray="191.6"
              stroke-dashoffset="191.6"></circle>
      <circle class="spark" id="ball-spark" cx="32" cy="3.4" r="2.2"></circle>
    </svg>
    <div class="core">
      <img class="pet" id="ball-pet" alt="" draggable="false" hidden>
      <svg class="q" id="ball-q" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="30.5" cy="31" r="17.2" fill="none" stroke="currentColor" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="88 21" transform="rotate(38 30.5 31)"/>
        <path d="M34.5 36.5c5.3 4.4 10.2 9.2 19.5 18.3" fill="none" stroke="currentColor"
              stroke-width="6.6" stroke-linecap="round"/>
      </svg>
      <b class="roll" id="speed-value">0</b>
      <small>tok/s</small>
    </div>
  </div>

<script type="module">
  import { Events } from "/wails/runtime.js";
  import * as Bound from "./bindings/qka/internal/gui/boundservice.js";
  import { setRoll } from "./assets/odometer.js";
  import {
    normalizeTitleTheme,
    titleLevelForSpeed,
    titleThresholds,
    titleThemeHues,
  } from "./assets/title-system.js";

  function asJSON(value) {
    return typeof value === "string" ? JSON.parse(value) : value;
  }

  // 与主窗口/面板一致的紧凑速率：小于 10 保留一位小数，千以上用 k/M/B。
  function compactTokenRate(value) {
    const number = Number(value);
    if (!Number.isFinite(number) || number <= 0) return "0";
    if (number < 10) {
      const rounded = Math.round(number * 10) / 10;
      return rounded >= 10 ? "10" : rounded.toFixed(1);
    }
    if (number < 1000) return String(Math.round(number));
    const units = [
      { value: 1e9, suffix: "B" },
      { value: 1e6, suffix: "M" },
      { value: 1e3, suffix: "k" },
    ];
    for (const unit of units) {
      if (number >= unit.value) {
        const scaled = number / unit.value;
        const text = scaled >= 10 ? String(Math.round(scaled)) : scaled.toFixed(1);
        return text + unit.suffix;
      }
    }
    return String(Math.round(number));
  }

  const ball = document.getElementById("ball");
  const valueNode = document.getElementById("speed-value");
  const ringBar = ball.querySelector(".ring .bar");
  const spark = document.getElementById("ball-spark");
  const petIcon = document.getElementById("ball-pet");
  const qMark = document.getElementById("ball-q");
  const RING_LENGTH = 191.6;
  const SPARK_RADIUS = 28.6;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let themeId = "vehicles";
  let sparkProgress = 0;
  let sparkFrame = 0;
  // 当前中央图标："" = Q 标记，否则是宠物/精灵球图标 URL。
  let iconKey = "";

  // 悬浮球中央图标跟 macOS 菜单栏同一套状态：精灵球模式显示精灵球，
  // 否则显示当前伙伴剪影；都没有就退回 Q 标记。
  function applyBallState(state) {
    if (!state || !petIcon || !qMark) return;
    let next = "";
    if (state.caught) {
      next = "./assets/tray/pokeball.png";
    } else if (state.pet_id && /^[a-z-]+$/.test(state.pet_id)) {
      next = "./assets/tray/" + state.pet_id + ".png";
    }
    if (next === iconKey) return;
    iconKey = next;
    if (iconKey) {
      petIcon.src = iconKey;
      petIcon.hidden = false;
      qMark.style.display = "none";
    } else {
      petIcon.removeAttribute("src");
      petIcon.hidden = true;
      qMark.style.display = "";
    }
  }

  // 光点按进度直接落位到圆环上（SVG 坐标从 3 点方向起算，.ring 自身再 -90°）。
  function placeSpark(progress) {
    if (!spark) return;
    const angle = (progress / 100) * Math.PI * 2;
    spark.setAttribute("cx", String(32 + SPARK_RADIUS * Math.cos(angle)));
    spark.setAttribute("cy", String(32 + SPARK_RADIUS * Math.sin(angle)));
    spark.style.opacity = progress > 0 ? "" : "0";
  }

  // 与圆环的 .42s 过渡同步，避免数值变化时光点瞬移。
  function animateSpark(progress) {
    if (!spark) return;
    if (sparkFrame) cancelAnimationFrame(sparkFrame);
    if (reducedMotion) {
      sparkProgress = progress;
      placeSpark(progress);
      return;
    }
    const from = sparkProgress;
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / 420);
      const eased = 1 - Math.pow(1 - t, 3);
      sparkProgress = from + (progress - from) * eased;
      placeSpark(sparkProgress);
      if (t < 1) {
        sparkFrame = requestAnimationFrame(step);
      } else {
        sparkFrame = 0;
      }
    }
    sparkFrame = requestAnimationFrame(step);
  }

  function applyTheme(theme) {
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    } else {
      delete document.documentElement.dataset.theme;
    }
  }

  // 环表示称号体系里的「总进度」：13 级把圆周等分，跨级时继续往前走，
// 不会在阈值处跳回起点（与原型 levelFor 的 frac 一致）。
  // 例：96–136 tok/s 是第 9 级，128 落在该级 80% 处 → (8 + 0.8) / 13 ≈ 67.7%。
  function ringProgress(speed, active) {
    const level = titleLevelForSpeed(speed, active);
    if (level < 1) return 0;
    const total = titleThresholds.length;
    if (level >= total) return 100;
    const lower = titleThresholds[level - 1];
    const upper = titleThresholds[level];
    const within = upper > lower
      ? Math.min(1, Math.max(0, (speed - lower) / (upper - lower)))
      : 1;
    return ((level - 1 + within) / total) * 100;
  }

  function render(view) {
    if (!view) return;
    const speed = Number(view.output_tokens_per_second) || 0;
    const active = Boolean(view.active);
    themeId = normalizeTitleTheme(view.title_theme_id || themeId);

    const text = compactTokenRate(speed);
    setRoll(valueNode, text);
    ball.classList.toggle("n4", text.length === 4);
    ball.classList.toggle("n5", text.length >= 5);
    ball.classList.toggle("idle", !active);
    ball.classList.toggle("live", active);

    // 环长度 = 称号总进度；颜色跟称号主题色相。进度头部的光点只随数值变化，
    // 不做连续旋转/扫描动画。
    const progress = ringProgress(speed, active);
    ringBar.setAttribute("stroke-dashoffset", String(RING_LENGTH * (1 - progress / 100)));
    animateSpark(progress);
    ball.style.setProperty("--ball-hue", String(titleThemeHues[themeId] ?? 193));
  }

  // 贴边态：Go 把窗口缩到 44px，这里是纯 CSS 依据视口宽度切换内容。
  function syncDocked() {
    ball.classList.toggle("docked", window.innerWidth < 60);
  }
  window.addEventListener("resize", syncDocked);
  syncDocked();

  Events.On("tokenspeed-changed", function (event) {
    if (!event || !event.data) return;
    render(asJSON(event.data));
  });
  Events.On("theme-changed", function (event) {
    applyTheme(event && event.data);
  });
  // 伙伴切换 / 精灵球状态与主窗口共享 localStorage：轮询变化比订阅事件
  // 更稳（事件只在主窗口发，球页错过的状态要靠拉取兜底）。
  function refreshBallState() {
    Bound.BarState()
      .then(function (view) {
        applyBallState(asJSON(view));
      })
      .catch(function () {});
  }
  Events.On("pet-selected", refreshBallState);
  Events.On("pet-caught", refreshBallState);
  refreshBallState();
  setInterval(refreshBallState, 5000);

  Bound.TokenSpeedGet()
    .then(function (view) {
      render(asJSON(view));
    })
    .catch(function () {});

  ball.addEventListener("click", function (event) {
    event.stopPropagation();
    try {
      const pending = Bound.BarToggle();
      if (pending && typeof pending.catch === "function") pending.catch(function () {});
    } catch (_) {}
  });
  ball.addEventListener("contextmenu", function (event) {
    event.preventDefault();
    event.stopPropagation();
    try {
      const pending = Bound.BarMenu();
      if (pending && typeof pending.catch === "function") pending.catch(function () {});
    } catch (_) {}
  });
</script>
</body>
</html>
