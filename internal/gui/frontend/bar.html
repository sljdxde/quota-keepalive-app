<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    }
    // Windows 平台标记：字体栈、字重与最小字号在 qka-ui.css 里按它分平台。
    // 用 navigator.platform（而非 UA 字符串）与 main.html 既有判断保持同源。
    if (!/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
      document.documentElement.classList.add("platform-win32");
    }
  })();
</script>
<link rel="stylesheet" href="assets/qka-ui.css">
<link rel="stylesheet" href="assets/ball.css">
<style>
  /* 拖动区域必须写在页面里（Wails 读取计算样式）：球体可拖，内容不参与
     拖动，点击仍冒泡到 #ball。 */
  /* 方形窗口（1.9 × 球径）里，除球与光晕外的部分必须全透明，
     否则会露出一块页面底色。qka-ui.css 给 body 设了 --bg，这里覆盖掉。 */
  html, body { background: transparent !important; }
  /* 画布尺寸由渲染核按 1.9×球径写（等于窗口大小），居中铺满即可。 */
  #ball { width: 100%; height: 100%; }

  #ball { --wails-draggable: drag; }
  #ball .led, #ball .orb-fx, #ball .core { --wails-draggable: no-drag; pointer-events: none; }

  /* 球面由 agent-speed 的渲染核绘制（丝绸核心 + 36 段 LED 环 + 彗星 +
     火花/余烬 + 冲击波），CSS 不再画底色/边框，避免叠两层玻璃。 */
  .ball {
    position: relative;
    width: 100%; height: 100%;
    background: transparent;
    border: 0;
    box-shadow: none;
    border-radius: 50%;
  }
  /* 两张画布叠在球心：WebGL 画丝绸与仪表，2D 画粒子与闪电。 */
  .ball .led, .ball .orb-fx {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    border-radius: 50%;
  }
  /* 数字：居中在球心（readout 的 -50% 偏移由模块写入）。
     字体沿用 agent-speed 原型 readout 的无衬线栈（SF Pro Display →
     Segoe UI Variable Display → Segoe UI）：早先的等宽栈在 Windows 上
     落到 Consolas，0 带斜杠、字重偏黑，和原型不是一个观感。
     字号由本页按「球径 + 文本长度」写入（长数字收字号，不出环）。 */
  .ball .core {
    position: absolute; left: 50%; top: 50%;
    display: grid; justify-items: center;
    text-align: center; line-height: 1;
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
      "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    /* transform 由渲染核每帧写（translate(-50%, readoutOffset)） */
  }
  /* 配色：球底是近黑的深蓝，读数必须离底色足够远才看得清。数字固定纯白，
     并在字形外再垫一圈暗光（filter 与内联 text-shadow 互不覆盖）；单位
     92% 白 + 暗底，活性态球体变亮时也不会糊进紫色丝绸里。 */
  .ball .core b.roll {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    /* odometer 的列宽按 1ch 对齐，字距必须为 0，否则每列推进对不上。 */
    letter-spacing: 0;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
    filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, .9));
    white-space: nowrap;
  }
  .ball .core .unit {
    font-weight: 600;
    letter-spacing: .04em;
    color: rgba(255, 255, 255, .92) !important;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .9);
    white-space: nowrap;
  }
  .ball.idle .core b.roll { color: #fff; }
  /* 贴边 36px 只放得下一个数：单位收起。 */
  .ball.docked .core .unit { display: none; }
</style>
</head>
<body>
  <!-- 常驻悬浮球：Windows 上等价于 macOS 菜单栏上的 QKA 状态项。
       渲染核逐字移植自 agent-speed 的规范参考原型（spec/prototypes/
       led-effects.html，MIT © zoefix，见 assets/orb-agent-speed.js）：
       丝绸核心 + 36 段 LED 热谱环 + 彗星 + 火花/余烬 + 响应冲击波 +
       破纪录金光。数字用连滚（odometer）由 onText 回调驱动。
       全部动效由数值与事件驱动；怠速静止时模块主动停帧。 -->
  <div id="ball" class="ball idle" role="button" title="Quota Keepalive">
    <canvas class="led" id="ball-gl" aria-hidden="true"></canvas>
    <canvas class="orb-fx" id="ball-fx" aria-hidden="true"></canvas>
    <div class="core">
      <b class="roll" id="speed-value">0</b>
      <span class="unit" id="speed-unit">tok/s</span>
    </div>
  </div>

<script type="module">
  import { Events, Window } from "/wails/runtime.js";
  import * as Bound from "./bindings/qka/internal/gui/boundservice.js";
  import { setRoll } from "./assets/odometer.js";
  import {
    normalizeSpeedDisplay,
    rollDurationFor,
  } from "./assets/speed-display.js";
  import { createAgentSpeedOrb } from "./assets/orb-agent-speed.js";
  import {
    DEFAULT_REDLINE,
    ballReadoutFontSize,
    ballReadoutUnitSize,
    createSpeedThrottle,
  } from "./assets/tokenspeed-viz.js";
  import { dockSideForWindow, dockContentShift } from "./assets/ball-dock.js";
  import { shouldStartDrag, dragTargetOrigin } from "./assets/bar-gesture.js";

  function asJSON(value) {
    return typeof value === "string" ? JSON.parse(value) : value;
  }

  const ball = document.getElementById("ball");
  const valueNode = document.getElementById("speed-value");
  const unitNode = document.getElementById("speed-unit");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 球径 = 容器（= 窗口）/ 1.9。用元素尺寸而不是 innerWidth，页面有
  // 内边距时也不会算错；贴边态窗口变窄时跟着缩。
  function ballDiameter() {
    return Math.round((ball.clientWidth || window.innerWidth || 122) / 1.9);
  }

  // 读数只排两行：数值 + tok/s（不放称号，长称号会顶出球外，而且称号色
  // 走热谱后和球底对比不足）。字号按球径与文本长度写入并标 !important：
  // 渲染核在 resize 时也会写一版固定字号，这里必须压过它，长数字才收得住。
  let lastSpeedText = "0";
  function layoutReadout(text) {
    lastSpeedText = text == null ? lastSpeedText : String(text);
    const size = ballDiameter();
    valueNode.style.setProperty("font-size", ballReadoutFontSize(size, lastSpeedText) + "px", "important");
    unitNode.style.setProperty("font-size", ballReadoutUnitSize(size) + "px", "important");
  }

  // 速度数字的显示方式与采样频率跟随主应用设置（token_speed_display /
  // token_speed_poll）：主应用切「平滑缓动」或「直接替换」时球面同步。
  let speedDisplayMode = "roll";
  let speedPollMillis = 500;

  // 球面数字：渲染核每帧算显示文本，但**最多每 500ms 落一次**。
  // 采样最密 200ms、实时速率本身还在窗口里连续变化；不节流的话数字每
  // 200ms 抖一下、连滚动画永远重启，人眼根本读不到变化。
  const speedThrottle = createSpeedThrottle(500, function (text) {
    layoutReadout(text);
    if (speedDisplayMode === "roll") {
      setRoll(valueNode, text, { duration: rollDurationFor(speedPollMillis) });
      return;
    }
    valueNode.textContent = text;
  });

  function writeSpeedText(text) {
    speedThrottle.push(text);
  }

  function loadSpeedSettings() {
    Bound.SettingsGet()
      .then(function (raw) {
        const values = asJSON(raw) || {};
        speedDisplayMode = normalizeSpeedDisplay(values.token_speed_display);
        speedPollMillis = Number(values.token_speed_poll) || 500;
      })
      .catch(function () {});
  }
  Events.On("token-speed-settings-changed", loadSpeedSettings);
  loadSpeedSettings();

  // 渲染核：逐字移植自 agent-speed 的规范参考原型，负责丝绸核心、36 段
  // LED 热谱环、彗星、火花/余烬、冲击波与破纪录金光。窗口 = 1.5 × 球径，
  // 球外的光晕与粒子才有地方画（clip=false）。
  const orb = createAgentSpeedOrb({
    stage: ball,
    glCanvas: document.getElementById("ball-gl"),
    fxCanvas: document.getElementById("ball-fx"),
    readout: ball.querySelector(".core"),
    valueEl: valueNode,
    unitEl: unitNode,
    // 球径 = 容器（= 窗口）/ 1.9。用元素尺寸而不是 innerWidth，
    // 页面有内边距时也不会算错。
    size: ballDiameter(),
    clip: false,
    redline: DEFAULT_REDLINE,
    readoutOffset: -50,
    reduceMotion: reducedMotion,
    onText: writeSpeedText,
  });

  function applyTheme(theme) {
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    } else {
      delete document.documentElement.dataset.theme;
    }
  }

  let lastResponseSeq = null;
  let lastPeakSeq = null;

  function render(view) {
    if (!view) return;
    const speed = Number(view.output_tokens_per_second) || 0;
    const active = Boolean(view.active);
    const redline = Number(view.redline_tokens_per_second) || DEFAULT_REDLINE;
    ball.classList.toggle("idle", !active);
    ball.classList.toggle("live", active);

    orb.setState({ value: speed, redline: redline });

    // 事件：响应完成 → 冲击波（强度按速度缩放）；破纪录 → 金色庆祝。
    // 快照里带单调序号，首次收到时不补播历史事件。
    const responseSeq = Number(view.response_seq) || 0;
    if (lastResponseSeq !== null && responseSeq > lastResponseSeq && active) {
      orb.pulse(Math.min(1, 0.45 + speed / 1500));
    }
    lastResponseSeq = responseSeq;
    const peakSeq = Number(view.peak_seq) || 0;
    if (lastPeakSeq !== null && peakSeq > lastPeakSeq) {
      orb.peak();
    }
    lastPeakSeq = peakSeq;
  }

  // 贴边态：Go 把窗口缩到 36px 并有一半放到屏幕外；页面按视口宽度切内容，
  // 再用「窗口矩形 vs 工作区」推断贴的是哪条边，把内容往屏幕内移。
  let dockTimer = 0;
  let dockPoll = 0;
  function syncDocked() {
    // 浮动窗口 122、贴边窗口 76：以两者之间为判据。
    const docked = window.innerWidth < 99;
    ball.classList.toggle("docked", docked);
    const screen = window.screen || {};
    const side = docked ? dockSideForWindow({
      screenX: window.screenX,
      screenY: window.screenY,
      width: window.innerWidth,
      height: window.innerHeight,
      availLeft: screen.availLeft,
      availTop: screen.availTop,
      availWidth: screen.availWidth,
      availHeight: screen.availHeight,
    }) : "";
    const shift = dockContentShift(side);
    ball.style.setProperty("--dock-x", shift.x + "px");
    ball.style.setProperty("--dock-y", shift.y + "px");
    ball.dataset.dock = side;
    orb.setSize(ballDiameter());
    // 渲染核 resize 会写一版固定字号；这里紧跟一次自适应字号（带
    // !important），贴边缩到 76px 窗口时读数仍然收在球内。
    layoutReadout(lastSpeedText);
    if (docked && !dockPoll) {
      dockPoll = setInterval(syncDocked, 500);
    } else if (!docked && dockPoll) {
      clearInterval(dockPoll);
      dockPoll = 0;
    }
  }
  window.addEventListener("resize", function () {
    syncDocked();
    clearTimeout(dockTimer);
    dockTimer = setTimeout(syncDocked, 80);
  });
  syncDocked();

  // ---------- 手势：按住并移动超过阈值才拖动，否则算点击 ----------
  // Wails 的 --wails-draggable 在 mousedown 就武装拖动，鼠标移动 1px 即进入
  // 原生移动循环，之后的 pointerup/click 会被 runtime 吞掉——表现为「点了
  // 没反应」。这里按下不武装拖动，位移超过 6px 才手动升级为原生拖动。
  let pressed = false;
  let pressX = 0;
  let pressY = 0;
  let dragArmed = false;

  ball.addEventListener("pointerdown", function (event) {
    if (event.button !== 0) return;
    event.stopPropagation();
    pressed = true;
    dragArmed = false;
    pressX = event.clientX;
    pressY = event.clientY;
  });

  function startNativeDrag(event) {
    dragArmed = true;
    pressed = false;
    const target = dragTargetOrigin({
      clientX: event.clientX,
      clientY: event.clientY,
      windowW: window.innerWidth,
      windowH: window.innerHeight,
      screenX: window.screenX,
      screenY: window.screenY,
    });
    Window.SetPosition(target.x, target.y)
      .then(function () {
        try {
          const pending = Bound.BarStartDrag();
          if (pending && typeof pending.catch === "function") pending.catch(function () {});
        } catch (_) {}
      })
      .catch(function () {});
  }

  ball.addEventListener("pointermove", function (event) {
    if (!pressed || dragArmed) return;
    if (!shouldStartDrag({
      pressed: pressed,
      buttons: event.buttons,
      dx: event.clientX - pressX,
      dy: event.clientY - pressY,
    })) return;
    startNativeDrag(event);
  });

  function finishPress(event) {
    if (event.button !== undefined && event.button !== 0) return;
    if (!pressed) return;
    pressed = false;
    event.stopPropagation();
    if (dragArmed) return;
    // 单击（贴边或浮动）：Go 侧 BarToggle —— 贴边时弹回，浮动时开关面板。
    try {
      const pending = Bound.BarToggle();
      if (pending && typeof pending.catch === "function") pending.catch(function () {});
    } catch (_) {}
  }
  ball.addEventListener("pointerup", finishPress);
  ball.addEventListener("pointercancel", function () {
    pressed = false;
    dragArmed = false;
  });

  ball.addEventListener("contextmenu", function (event) {
    event.preventDefault();
    event.stopPropagation();
    try {
      const pending = Bound.BarMenu();
      if (pending && typeof pending.catch === "function") pending.catch(function () {});
    } catch (_) {}
  });

  Events.On("tokenspeed-changed", function (event) {
    if (!event || !event.data) return;
    render(asJSON(event.data));
  });
  Events.On("theme-changed", function (event) {
    applyTheme(event && event.data);
  });
  Events.On("common:WindowShow", function (event) {
    if (event && event.sender && event.sender !== "bar") return;
    Bound.TokenSpeedGet()
      .then(function (view) { render(asJSON(view)); })
      .catch(function () {});
  });
  Bound.TokenSpeedGet()
    .then(function (view) {
      render(asJSON(view));
    })
    .catch(function () {});
</script>
</body>
</html>
