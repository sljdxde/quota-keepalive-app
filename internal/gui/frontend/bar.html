<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    }
  })();
</script>
<link rel="stylesheet" href="assets/qka-ui.css">
<link rel="stylesheet" href="assets/ball.css">
<style>
  /* 拖动区域必须写在页面里（Wails 读取计算样式）：球体可拖，内部图标/数字
     不参与拖动，点击仍冒泡到 #ball。 */
  #ball { --wails-draggable: drag; }
  #ball .ring, #ball .core { --wails-draggable: no-drag; pointer-events: none; }
</style>
</head>
<body>
  <!-- 常驻悬浮球：Windows 上等价于 macOS 菜单栏上的 QKA 状态项。
       窗口本身已被 shapeBarWindow 裁成正圆，这里铺满并画卡片底；
       按住可拖动（--wails-draggable），短按放技能 / 长按抛精灵球，
       右键出菜单。拖到屏幕边缘会收成 44px 半圆（Go 侧 SetSize），
       此时只显示 Q。 -->
  <div id="ball" class="ball idle" role="button" title="Quota Keepalive">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="ring-gradient" x1="8" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
          <stop offset="0" style="stop-color:hsl(var(--ball-hue, 193) 92% 66%)"></stop>
          <stop offset="1" style="stop-color:hsl(calc(var(--ball-hue, 193) + 55) 92% 70%)"></stop>
        </linearGradient>
      </defs>
      <circle class="track" cx="32" cy="32" r="30.5"></circle>
      <circle class="bar" cx="32" cy="32" r="30.5" stroke-dasharray="191.6"
              stroke-dashoffset="191.6"></circle>
      <circle class="spark" id="ball-spark" cx="32" cy="3.4" r="2.2"></circle>
    </svg>
    <div class="core">
      <svg class="q" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="30.5" cy="31" r="17.2" fill="none" stroke="currentColor" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="88 21" transform="rotate(38 30.5 31)"/>
        <path d="M34.5 36.5c5.3 4.4 10.2 9.2 19.5 18.3" fill="none" stroke="currentColor"
              stroke-width="6.6" stroke-linecap="round"/>
      </svg>
      <b class="roll" id="speed-value">0</b>
      <small>tok/s</small>
    </div>
    <!-- 捕获结果横幅：美漫风格（斜切描边大字 + 速度线），只在结果瞬间出现。 -->
    <div class="popup" id="ball-popup" hidden>
      <span class="popup-text" id="ball-popup-text">捕获成功！</span>
    </div>
    <!-- 长按蓄力进度：沿环内侧的细弧，不引入新的持续动画。 -->
    <svg class="charge" viewBox="0 0 64 64" aria-hidden="true">
      <circle id="ball-charge" cx="32" cy="32" r="26" stroke-dasharray="163.4"
              stroke-dashoffset="163.4"></circle>
    </svg>
  </div>

<script type="module">
  import { Events, Window } from "/wails/runtime.js";
  import * as Bound from "./bindings/qka/internal/gui/boundservice.js";
  import { setRoll } from "./assets/odometer.js";
  import {
    normalizeTitleTheme,
    titleLevelForSpeed,
    titleThresholds,
    titleThemeHues,
  } from "./assets/title-system.js";
  import {
    POKEMON_CATALOG,
    evolutionStageForDailyTokens,
    pokemonById,
  } from "./assets/pokemon-art.js";
  import { createPokemon3D } from "./assets/pokemon-3d.js";
  import {
    sweepProgress,
    timingAccuracy,
    captureOutcome,
  } from "./assets/pet-motion.js";
  import {
    CHARGE_THROW_MS,
    DRAG_START_PX,
    resolveGesture,
    shouldStartDrag,
    dragTargetOrigin,
    chargeProgress,
  } from "./assets/bar-gesture.js";

  function asJSON(value) {
    return typeof value === "string" ? JSON.parse(value) : value;
  }

  // 与主窗口/面板一致的紧凑速率：小于 10 保留一位小数，千以上用 k/M/B。
  function compactTokenRate(value) {
    const number = Number(value);
    if (!Number.isFinite(number) || number <= 0) return "0";
    if (number < 10) {
      const rounded = Math.round(number * 10) / 10;
      return rounded >= 10 ? "10" : rounded.toFixed(1);
    }
    if (number < 1000) return String(Math.round(number));
    const units = [
      { value: 1e9, suffix: "B" },
      { value: 1e6, suffix: "M" },
      { value: 1e3, suffix: "k" },
    ];
    for (const unit of units) {
      if (number >= unit.value) {
        const scaled = number / unit.value;
        const text = scaled >= 10 ? String(Math.round(scaled)) : scaled.toFixed(1);
        return text + unit.suffix;
      }
    }
    return String(Math.round(number));
  }

  const ball = document.getElementById("ball");
  const valueNode = document.getElementById("speed-value");
  const ringBar = ball.querySelector(".ring .bar");
  const spark = document.getElementById("ball-spark");
  const chargeArc = document.getElementById("ball-charge");
  const popup = document.getElementById("ball-popup");
  const popupText = document.getElementById("ball-popup-text");
  const CHARGE_LENGTH = 163.4;
  const RING_LENGTH = 191.6;
  const SPARK_RADIUS = 28.6;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let themeId = "vehicles";
  let sparkProgress = 0;
  let sparkFrame = 0;
  let todayTokens = 0;
  let chargeFrame = 0;
  let chargeStartMS = 0;
  let pressStartMS = 0;
  let pressX = 0;
  let pressY = 0;
  let pressed = false;
  let throwing = false;

  function applyTheme(theme) {
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    } else {
      delete document.documentElement.dataset.theme;
    }
  }

  // 环表示称号体系里的「总进度」：13 级把圆周等分，跨级时继续往前走，
  // 不会在阈值处跳回起点（与原型 levelFor 的 frac 一致）。
  function ringProgress(speed, active) {
    const level = titleLevelForSpeed(speed, active);
    if (level < 1) return 0;
    const total = titleThresholds.length;
    if (level >= total) return 100;
    const lower = titleThresholds[level - 1];
    const upper = titleThresholds[level];
    const within = upper > lower
      ? Math.min(1, Math.max(0, (speed - lower) / (upper - lower)))
      : 1;
    return ((level - 1 + within) / total) * 100;
  }

  function render(view) {
    if (!view) return;
    const speed = Number(view.output_tokens_per_second) || 0;
    const active = Boolean(view.active);
    themeId = normalizeTitleTheme(view.title_theme_id || themeId);
    todayTokens = Math.max(0, Number(view.today_total_tokens) || 0);

    const text = compactTokenRate(speed);
    setRoll(valueNode, text);
    ball.classList.toggle("n4", text.length === 4);
    ball.classList.toggle("n5", text.length >= 5);
    ball.classList.toggle("idle", !active);
    ball.classList.toggle("live", active);

    // 环长度 = 称号总进度；颜色跟称号主题色相。进度头部的光点只随数值变化，
    // 不做连续旋转/扫描动画。
    const progress = ringProgress(speed, active);
    ringBar.setAttribute("stroke-dashoffset", String(RING_LENGTH * (1 - progress / 100)));
    animateSpark(progress);
    ball.style.setProperty("--ball-hue", String(titleThemeHues[themeId] ?? 193));
  }

  // ---------- 迷你宠物：球内 3D 舞台 ----------
  const stage = document.createElement("div");
  stage.className = "pet-stage";
  stage.innerHTML = '<div class="pet-avatar is-loading" id="ball-avatar"></div>';
  ball.appendChild(stage);
  const avatar = document.getElementById("ball-avatar");

  const SELECTED_KEY = "qka.pet.selected";
  const CAUGHT_KEY = "qka.pet.caught.v1";
  let pet = null;
  let viewer = null;
  let viewerPetId = "";
  let popupTimer = 0;

  function readStoredString(key, fallback) {
    try {
      return localStorage.getItem(key) || fallback;
    } catch (_) {
      return fallback;
    }
  }

  function selectedPet() {
    return pokemonById(readStoredString(SELECTED_KEY, "")) || POKEMON_CATALOG[0];
  }

  function readCaughtMap() {
    try {
      const parsed = JSON.parse(localStorage.getItem(CAUGHT_KEY) || "null");
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch (_) {
      return {};
    }
  }

  function writeCaught(petId, caught) {
    const map = readCaughtMap();
    if (caught) map[petId] = true;
    else delete map[petId];
    try {
      localStorage.setItem(CAUGHT_KEY, JSON.stringify(map));
    } catch (_) {}
  }

  function isCaught(petId) {
    return !!readCaughtMap()[petId];
  }

  function effectIntensity() {
    return Math.max(1, Math.min(5, evolutionStageForDailyTokens(todayTokens)));
  }

  function ensureViewer(nextPet) {
    if (viewer && viewerPetId === nextPet.id) {
      viewer.setEffectIntensity(effectIntensity());
      return;
    }
    if (viewer) viewer.dispose();
    viewer = null;
    viewerPetId = nextPet.id;
    avatar.innerHTML =
      '<canvas class="pokemon-3d-canvas" aria-hidden="true"></canvas>' + nextPet.art;
    avatar.className = "pet-avatar pet-" + nextPet.id + " is-loading";
    const canvas = avatar.querySelector(".pokemon-3d-canvas");
    viewer = createPokemon3D(canvas, {
      models: [nextPet.stages[0].model],
      boneAdjust: nextPet.stages[0].pose || null,
      eyeMaterial: nextPet.eyeMaterial || null,
      eyeMesh: nextPet.eyeMesh || null,
      modelRotations: [nextPet.stages[0].rotation || null],
      stage: 1,
      enabled: true,
      effectIntensity: effectIntensity(),
      onLoading: function (loading) {
        if (viewerPetId === nextPet.id) {
          avatar.classList.toggle("is-loading", loading !== false);
        }
      },
      onReady: function () {
        if (viewerPetId !== nextPet.id) return;
        avatar.classList.remove("is-loading", "model-fallback");
        avatar.classList.add("is-3d");
      },
      onUnavailable: function () {
        if (viewerPetId !== nextPet.id) return;
        avatar.classList.remove("is-3d", "is-loading");
        avatar.classList.add("model-fallback");
      },
      onError: function () {
        if (viewerPetId !== nextPet.id) return;
        avatar.classList.remove("is-3d", "is-loading");
        avatar.classList.add("model-fallback");
      },
    });
    if (viewer && !viewer.isCapturing()) {
      viewer.setCaught(isCaught(nextPet.id), false);
    }
  }

  function refreshPet() {
    pet = selectedPet();
    ensureViewer(pet);
    ball.classList.toggle("has-pet", !!pet);
  }
  Events.On("pet-selected", refreshPet);
  Events.On("pet-caught", function (event) {
    const data = event && event.data;
    const caught = data && typeof data === "object" ? !!data.caught : !!data;
    if (viewer && !viewer.isCapturing()) viewer.setCaught(caught, false);
  });
  refreshPet();

  // ---------- 美漫风格结果横幅 ----------
  function showPopup(text, kind) {
    if (!popup || !popupText) return;
    popupText.textContent = text;
    popup.className = "popup " + (kind || "ok");
    popup.hidden = false;
    // 重启弹跳动画。
    popup.style.animation = "none";
    void popup.offsetWidth;
    popup.style.animation = "";
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(function () {
      popup.hidden = true;
      popupTimer = 0;
    }, 1600);
  }

  // ---------- 单击放技能 / 长按抛精灵球 ----------
  function currentSkillTier() {
    return evolutionStageForDailyTokens(todayTokens);
  }

  function chargeTick() {
    if (!pressed || !chargeStartMS) return;
    const progress = chargeProgress(performance.now() - chargeStartMS);
    chargeArc.setAttribute("stroke-dashoffset",
      String(CHARGE_LENGTH * (1 - progress)));
    if (viewer) viewer.setCharging(progress >= 0.12);
    if (progress >= 1) {
      // 长按到位：抛球（判定在松手时给出）。
      chargeStartMS = 0;
      chargeFrame = 0;
      return;
    }
    chargeFrame = requestAnimationFrame(chargeTick);
  }

  function stopChargeUi() {
    if (chargeFrame) cancelAnimationFrame(chargeFrame);
    chargeFrame = 0;
    chargeStartMS = 0;
    chargeArc.setAttribute("stroke-dashoffset", String(CHARGE_LENGTH));
    if (viewer) viewer.setCharging(false);
  }

  function releasePetBall() {
    if (!pet || !viewer) return;
    viewer.releaseBall();
    writeCaught(pet.id, false);
    try {
      Events.Emit("pet-caught", { caught: false });
    } catch (_) {}
    showPopup("回来了！", "ok");
  }

  function throwNow() {
    if (!pet || !viewer || viewer.isCaught() || throwing) return;
    const held = Math.max(0, performance.now() - pressStartMS);
    const sweep = sweepProgress(held);
    const accuracy = timingAccuracy(sweep.position);
    const outcome = captureOutcome({
      accuracy: accuracy,
      tier: currentSkillTier(),
    });
    throwing = true;
    viewer.throwBall({
      willDodge: outcome.dodged,
      willCatch: outcome.caught,
      onResolved: function (result) {
        throwing = false;
        if (result && result.caught) {
          writeCaught(pet.id, true);
          try {
            Events.Emit("pet-caught", { caught: true });
          } catch (_) {}
          showPopup("捕获成功！", "ok");
        } else if (result && result.dodged) {
          showPopup("躲开了！", "miss");
        } else {
          showPopup("捕获失败", "miss");
        }
      },
    });
  }

  // 关键：Wails 的 --wails-draggable 让「按下后只要鼠标移动 1px」就进入
  // 原生拖动循环，随后的 pointerup/click 会被 runtime 吞掉——左键就再也不
  // 能触发任何交互，而且用户只是想点一下、手稍有抖动就把球拖走。这里把
  // 拖动降级为「按住且移动超过阈值」才交给系统拖动：短按/长按的手势先在
  // 页面内完成（判定逻辑在 assets/bar-gesture.js，纯函数、可真实单测）。

  ball.addEventListener("pointerdown", function (event) {
    if (event.button !== 0) return;
    event.stopPropagation();
    pressed = true;
    pressStartMS = performance.now();
    pressX = event.clientX;
    pressY = event.clientY;
    chargeStartMS = pressStartMS;
    chargeFrame = requestAnimationFrame(chargeTick);
  });
  // 按住期间移动超过阈值才升级为窗口拖动：把球心挪到指针下并用系统拖动。
  // 先取消页面手势，避免松手时又触发技能/抛球；SetPosition 把窗口对中后，
  // 立即调用 Bound.BarStartDrag 让 Go 侧进入原生移动循环（HTCAPTION），
  // 球就跟着指针走；期间 runtime 会吞掉后续鼠标事件，不会误触发手势。
  function startNativeDrag(event) {
    pressed = false;
    stopChargeUi();
    if (viewer) viewer.setCharging(false);
    const target = dragTargetOrigin({
      clientX: event.clientX,
      clientY: event.clientY,
      windowW: window.innerWidth,
      windowH: window.innerHeight,
      screenX: window.screenX,
      screenY: window.screenY,
    });
    Window.SetPosition(target.x, target.y)
      .then(function () {
        try {
          const pending = Bound.BarStartDrag();
          if (pending && typeof pending.catch === "function") pending.catch(function () {});
        } catch (_) {}
      })
      .catch(function () {});
  }
  ball.addEventListener("pointermove", function (event) {
    if (!shouldStartDrag({
      pressed: pressed,
      buttons: event.buttons,
      dx: event.clientX - pressX,
      dy: event.clientY - pressY,
    })) return;
    startNativeDrag(event);
  });

  function finishPress(event) {
    if (event.button !== undefined && event.button !== 0) return;
    if (!pressed) return;
    event.stopPropagation();
    pressed = false;
    const gesture = resolveGesture({
      heldMs: performance.now() - pressStartMS,
      docked: window.innerWidth < 60,
      caught: !!(viewer && viewer.isCaught()),
      capturing: !!(viewer && viewer.isCapturing()),
      moved: false,
      hasPet: !!pet,
    });
    stopChargeUi();
    switch (gesture.action) {
      case "dock-toggle":
        // 贴边态（44px 半圆）短按：弹回浮动态并打开迷你宠物（窗口很小，
        // 容不下宠物交互；弹回由 Go 侧 BarToggle 完成）。
        try {
          const pending = Bound.BarToggle();
          if (pending && typeof pending.catch === "function") pending.catch(function () {});
        } catch (_) {}
        return;
      case "throw":
        throwNow();
        return;
      case "release":
        releasePetBall();
        return;
      case "skill":
        viewer.playSkill(pet.effect, effectIntensity());
        return;
    }
    // "none"：拖动中弹起或无宠物，静默。
  }
  ball.addEventListener("pointerup", finishPress);
  ball.addEventListener("pointercancel", function () {
    pressed = false;
    stopChargeUi();
  });

  // 贴边态：Go 把窗口缩到 44px，这里是纯 CSS 依据视口宽度切换内容。
  function syncDocked() {
    const docked = window.innerWidth < 60;
    ball.classList.toggle("docked", docked);
    stage.style.display = docked ? "none" : "";
    if (docked) {
      pressed = false;
      stopChargeUi();
    }
  }
  window.addEventListener("resize", syncDocked);
  syncDocked();

  Events.On("tokenspeed-changed", function (event) {
    if (!event || !event.data) return;
    render(asJSON(event.data));
  });
  Events.On("theme-changed", function (event) {
    applyTheme(event && event.data);
  });
  Events.On("common:WindowShow", function (event) {
    if (event && event.sender && event.sender !== "bar") return;
    refreshPet();
    Bound.TokenSpeedGet()
      .then(function (view) { render(asJSON(view)); })
      .catch(function () {});
  });
  Bound.TokenSpeedGet()
    .then(function (view) {
      render(asJSON(view));
    })
    .catch(function () {});

  ball.addEventListener("contextmenu", function (event) {
    event.preventDefault();
    event.stopPropagation();
    try {
      const pending = Bound.BarMenu();
      if (pending && typeof pending.catch === "function") pending.catch(function () {});
    } catch (_) {}
  });
</script>
</body>
</html>
