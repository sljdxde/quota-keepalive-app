<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    }
  })();
</script>
<link rel="stylesheet" href="assets/qka-ui.css">
<link rel="stylesheet" href="assets/ball.css">
<style>
  /* 拖动区域必须写在页面里（Wails 读取计算样式）：球体可拖，内部图标/数字
     不参与拖动，点击仍冒泡到 #ball。 */
  #ball { --wails-draggable: drag; }
  #ball .ring, #ball .core { --wails-draggable: no-drag; pointer-events: none; }
</style>
</head>
<body>
  <!-- 常驻悬浮球：Windows 上等价于 macOS 菜单栏上的 QKA 状态项。
       球面 = 24px 小宠物（有速度时跑动，越快越快）+ 纯数字速度（无单位）；
       伙伴被收进精灵球时换成精灵球（速度越快晃得越快，>1000 自动放出）。
       按住可拖动；左键单击打开迷你宠物窗口；右键出菜单。
       拖到屏幕边缘会收成 44px 半圆（Go 侧 SetSize），此时只显示宠物/精灵球。 -->
  <div id="ball" class="ball idle" role="button" title="Quota Keepalive">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <defs>
        <linearGradient id="ring-gradient" x1="8" y1="10" x2="56" y2="54" gradientUnits="userSpaceOnUse">
          <stop offset="0" style="stop-color:hsl(var(--ball-hue, 193) 92% 66%)"></stop>
          <stop offset="1" style="stop-color:hsl(calc(var(--ball-hue, 193) + 55) 92% 70%)"></stop>
        </linearGradient>
      </defs>
      <circle class="track" cx="32" cy="32" r="30.5"></circle>
      <circle class="bar" cx="32" cy="32" r="30.5" stroke-dasharray="191.6"
              stroke-dashoffset="191.6"></circle>
      <circle class="spark" id="ball-spark" cx="32" cy="3.4" r="2.2"></circle>
    </svg>
    <div class="core">
      <!-- 球面宠物：始终用 2D 立绘。64px 窗口里的 3D 全身体积太小、
           模型加载失败时还会留下空白，所以球面不再创建 WebGL 舞台；
           3D 只留在迷你宠物窗口里。 -->
      <div class="pet-icon" id="ball-pet">
        <img class="pet-fallback" id="ball-pet-img" alt="" draggable="false">
      </div>
      <!-- 精灵球（伙伴被收进球时；显隐由 .show-ball 控制，SVG 没有 hidden 属性） -->
      <svg class="ball-icon" id="ball-ball" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M2.5 12h19" stroke="currentColor" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="3.2" fill="var(--card, #fff)" stroke="currentColor" stroke-width="1.6"/>
      </svg>
      <svg class="q" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="30.5" cy="31" r="17.2" fill="none" stroke="currentColor" stroke-width="8"
                stroke-linecap="round" stroke-dasharray="88 21" transform="rotate(38 30.5 31)"/>
        <path d="M34.5 36.5c5.3 4.4 10.2 9.2 19.5 18.3" fill="none" stroke="currentColor"
              stroke-width="6.6" stroke-linecap="round"/>
      </svg>
      <b class="roll" id="speed-value">0</b>
    </div>
  </div>

<script type="module">
  import { Events, Window } from "/wails/runtime.js";
  import * as Bound from "./bindings/qka/internal/gui/boundservice.js";
  import { setRoll } from "./assets/odometer.js";
  import {
    normalizeTitleTheme,
    titleLevelForSpeed,
    titleThresholds,
    titleThemeHues,
  } from "./assets/title-system.js";
  import { POKEMON_CATALOG, pokemonById } from "./assets/pokemon-art.js";
  import { ballFaceState } from "./assets/ball-face.js";
  import { dockSideForWindow, dockContentShift } from "./assets/ball-dock.js";
  import {
    shouldStartDrag,
    dragTargetOrigin,
  } from "./assets/bar-gesture.js";

  function asJSON(value) {
    return typeof value === "string" ? JSON.parse(value) : value;
  }

  // 与主窗口/面板一致的紧凑速率：小于 10 保留一位小数，千以上用 k/M/B。
  function compactTokenRate(value) {
    const number = Number(value);
    if (!Number.isFinite(number) || number <= 0) return "0";
    if (number < 10) {
      const rounded = Math.round(number * 10) / 10;
      return rounded >= 10 ? "10" : rounded.toFixed(1);
    }
    if (number < 1000) return String(Math.round(number));
    const units = [
      { value: 1e9, suffix: "B" },
      { value: 1e6, suffix: "M" },
      { value: 1e3, suffix: "k" },
    ];
    for (const unit of units) {
      if (number >= unit.value) {
        const scaled = number / unit.value;
        const text = scaled >= 10 ? String(Math.round(scaled)) : scaled.toFixed(1);
        return text + unit.suffix;
      }
    }
    return String(Math.round(number));
  }

  const ball = document.getElementById("ball");
  const valueNode = document.getElementById("speed-value");
  const ringBar = ball.querySelector(".ring .bar");
  const spark = document.getElementById("ball-spark");
  const petNode = document.getElementById("ball-pet");
  const petImg = document.getElementById("ball-pet-img");
  const RING_LENGTH = 191.6;
  const SPARK_RADIUS = 28.6;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const SELECTED_KEY = "qka.pet.selected";
  const CAUGHT_KEY = "qka.pet.caught.v1";

  let themeId = "vehicles";
  let sparkProgress = 0;
  let sparkFrame = 0;
  let currentSpeed = 0;
  let currentText = "0";
  let pet = POKEMON_CATALOG[0];
  let petSpriteId = "";

  function readStoredString(key, fallback) {
    try {
      return localStorage.getItem(key) || fallback;
    } catch (_) {
      return fallback;
    }
  }

  function selectedPet() {
    return pokemonById(readStoredString(SELECTED_KEY, "")) || POKEMON_CATALOG[0];
  }

  function readCaughtMap() {
    try {
      const parsed = JSON.parse(localStorage.getItem(CAUGHT_KEY) || "null");
      return parsed && typeof parsed === "object" ? parsed : {};
    } catch (_) {
      return {};
    }
  }

  function isCaught(petId) {
    return !!readCaughtMap()[petId];
  }

  function writeCaught(petId, caught) {
    const map = readCaughtMap();
    if (caught) map[petId] = true;
    else delete map[petId];
    try {
      localStorage.setItem(CAUGHT_KEY, JSON.stringify(map));
    } catch (_) {}
  }

  function applyTheme(theme) {
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    } else {
      delete document.documentElement.dataset.theme;
    }
  }

  // 光点按进度直接落位到圆环上（SVG 坐标从 3 点方向起算，.ring 自身再 -90°）。
  function placeSpark(progress) {
    if (!spark) return;
    const angle = (progress / 100) * Math.PI * 2;
    spark.setAttribute("cx", String(32 + SPARK_RADIUS * Math.cos(angle)));
    spark.setAttribute("cy", String(32 + SPARK_RADIUS * Math.sin(angle)));
    spark.style.opacity = progress > 0 ? "" : "0";
  }

  function animateSpark(progress) {
    if (!spark) return;
    if (sparkFrame) cancelAnimationFrame(sparkFrame);
    if (reducedMotion) {
      sparkProgress = progress;
      placeSpark(progress);
      return;
    }
    const from = sparkProgress;
    const start = performance.now();
    function step(now) {
      const t = Math.min(1, (now - start) / 420);
      const eased = 1 - Math.pow(1 - t, 3);
      sparkProgress = from + (progress - from) * eased;
      placeSpark(sparkProgress);
      if (t < 1) {
        sparkFrame = requestAnimationFrame(step);
      } else {
        sparkFrame = 0;
      }
    }
    sparkFrame = requestAnimationFrame(step);
  }

  function ringProgress(speed, active) {
    const level = titleLevelForSpeed(speed, active);
    if (level < 1) return 0;
    const total = titleThresholds.length;
    if (level >= total) return 100;
    const lower = titleThresholds[level - 1];
    const upper = titleThresholds[level];
    const within = upper > lower
      ? Math.min(1, Math.max(0, (speed - lower) / (upper - lower)))
      : 1;
    return ((level - 1 + within) / total) * 100;
  }

  // ---------- 球面主体：宠物（未捕获）/ 精灵球（已捕获） ----------
  function updatePetSprite(nextPet) {
    if (petSpriteId === nextPet.id) return;
    petSpriteId = nextPet.id;
    petImg.src = "./assets/pokemon/" + nextPet.stages[0].sprite;
  }

  // 球面的两种模式只在 paintFace 里切换：宠物可见 / 精灵球可见、跑动 / 晃动、
  // 速度字号，全部由 ball-face.js 的纯函数判定，页面只负责落 DOM。
  function paintFace() {
    const caught = isCaught(pet.id);
    const face = ballFaceState({
      caught: caught,
      speed: currentSpeed,
      speedText: currentText,
      reducedMotion: reducedMotion,
    });
    ball.classList.add("has-pet");
    ball.classList.toggle("caught", caught);
    // 宠物与精灵球互斥：用类控制显隐（SVG 元素没有 hidden IDL 属性，
    // 给 SVG 设 .hidden = false 不会移除 hidden 属性，精灵球会一直不显示）。
    ball.classList.toggle("show-pet", face.petVisible);
    ball.classList.toggle("show-ball", face.ballVisible);
    if (face.petVisible) updatePetSprite(pet);

    petNode.classList.toggle("running", face.running);
    ball.classList.toggle("shaking", face.shaking);
    if (face.running) {
      petNode.style.setProperty("--run-duration", face.runSeconds + "s");
    } else {
      petNode.style.removeProperty("--run-duration");
    }
    if (face.shaking) {
      ball.style.setProperty("--shake-duration", face.shakeSeconds + "s");
    } else {
      ball.style.removeProperty("--shake-duration");
    }
    // 字号跟着数字长度走：3 位以内 16px、4 位 14px、5 位以上 12px。
    valueNode.style.fontSize = face.speedFontPx + "px";
    return face;
  }

  function renderBallState() {
    pet = selectedPet();
    paintFace();
  }

  // 捕获状态写回（localStorage）+ 广播给迷你宠物窗口；球面立即重绘，
  // 不依赖事件回环（同一窗口的 Emit 不保证同步派发）。
  function setCaught(caught) {
    writeCaught(pet.id, caught);
    try {
      Events.Emit("pet-caught", { caught: caught, petId: pet.id });
    } catch (_) {}
    paintFace();
  }

  function render(view) {
    if (!view) return;
    const speed = Number(view.output_tokens_per_second) || 0;
    const active = Boolean(view.active);
    themeId = normalizeTitleTheme(view.title_theme_id || themeId);
    currentSpeed = speed;
    currentText = compactTokenRate(speed);

    setRoll(valueNode, currentText);
    ball.classList.toggle("idle", !active);
    ball.classList.toggle("live", active);

    const progress = ringProgress(speed, active);
    ringBar.setAttribute("stroke-dashoffset", String(RING_LENGTH * (1 - progress / 100)));
    animateSpark(progress);
    ball.style.setProperty("--ball-hue", String(titleThemeHues[themeId] ?? 193));

    const face = paintFace();
    // 超过 1000 tok/s：精灵球被挣开，自动放出伙伴。
    if (face.autoRelease) setCaught(false);
  }

  Events.On("pet-selected", renderBallState);
  // 捕获/放出事件携带权威结果：直接写回本地状态，避免依赖两个窗口共享
  // localStorage（悬浮球超速自动放出时，迷你宠物窗口也要立刻同步）。
  Events.On("pet-caught", function (event) {
    const data = event && event.data;
    const caught = data && typeof data === "object" ? data.caught : data;
    const petId = data && typeof data === "object" ? data.petId : "";
    // 只同步当前伙伴；事件若来自旧伙伴（切换间隙），忽略。
    if (pet && typeof caught === "boolean" && (!petId || petId === pet.id)) {
      writeCaught(pet.id, caught);
    }
    renderBallState();
  });
  renderBallState();

  // 贴边态：Go 把窗口缩到 44px 并有一半放到屏幕外，页面依据视口宽度切换内容；
  // 再用「窗口矩形 vs 工作区」推断贴的是哪条边，把宠物/精灵球往屏幕内移半宽，
  // 否则 18px 内容正好被窗口边界切成一半。
  let dockTimer = 0;
  let dockPoll = 0;
  function syncDocked() {
    const docked = window.innerWidth < 60;
    ball.classList.toggle("docked", docked);
    const screen = window.screen || {};
    const side = docked ? dockSideForWindow({
      screenX: window.screenX,
      screenY: window.screenY,
      width: window.outerWidth || window.innerWidth,
      height: window.outerHeight || window.innerHeight,
      availLeft: screen.availLeft,
      availTop: screen.availTop,
      availWidth: screen.availWidth,
      availHeight: screen.availHeight,
    }) : "";
    const shift = dockContentShift(side);
    ball.style.setProperty("--dock-x", shift.x + "px");
    ball.style.setProperty("--dock-y", shift.y + "px");
    ball.dataset.dock = side;
    // 贴边换边时窗口大小不变（44→44），没有 resize；贴边期间低频复核位置。
    if (docked && !dockPoll) {
      dockPoll = setInterval(syncDocked, 500);
    } else if (!docked && dockPoll) {
      clearInterval(dockPoll);
      dockPoll = 0;
    }
  }
  window.addEventListener("resize", function () {
    syncDocked();
    clearTimeout(dockTimer);
    // resize 可能早于 SetPosition 完成，稍后再按新坐标复核一次。
    dockTimer = setTimeout(syncDocked, 80);
  });
  syncDocked();

  Events.On("tokenspeed-changed", function (event) {
    if (!event || !event.data) return;
    render(asJSON(event.data));
  });
  Events.On("theme-changed", function (event) {
    applyTheme(event && event.data);
  });
  Events.On("common:WindowShow", function (event) {
    if (event && event.sender && event.sender !== "bar") return;
    renderBallState();
    Bound.TokenSpeedGet()
      .then(function (view) { render(asJSON(view)); })
      .catch(function () {});
  });
  Bound.TokenSpeedGet()
    .then(function (view) {
      render(asJSON(view));
    })
    .catch(function () {});

  // ---------- 左键：打开/切换迷你宠物；按住拖动超过阈值才移动窗口 ----------
  // Wails 的 --wails-draggable 在 mousedown 就武装拖动，鼠标移动 1px 即进入
  // 原生移动循环，之后的 pointerup/click 会被 runtime 吞掉——表现为「点了
  // 没反应」。这里按下不武装拖动，位移超过 6px 才手动升级为原生拖动。
  let pressed = false;
  let pressStartMS = 0;
  let pressX = 0;
  let pressY = 0;
  let dragArmed = false;

  ball.addEventListener("pointerdown", function (event) {
    if (event.button !== 0) return;
    event.stopPropagation();
    pressed = true;
    dragArmed = false;
    pressStartMS = performance.now();
    pressX = event.clientX;
    pressY = event.clientY;
  });

  function startNativeDrag(event) {
    dragArmed = true;
    pressed = false;
    const target = dragTargetOrigin({
      clientX: event.clientX,
      clientY: event.clientY,
      windowW: window.innerWidth,
      windowH: window.innerHeight,
      screenX: window.screenX,
      screenY: window.screenY,
    });
    Window.SetPosition(target.x, target.y)
      .then(function () {
        try {
          const pending = Bound.BarStartDrag();
          if (pending && typeof pending.catch === "function") pending.catch(function () {});
        } catch (_) {}
      })
      .catch(function () {});
  }

  ball.addEventListener("pointermove", function (event) {
    if (!pressed || dragArmed) return;
    if (!shouldStartDrag({
      pressed: pressed,
      buttons: event.buttons,
      dx: event.clientX - pressX,
      dy: event.clientY - pressY,
    })) return;
    startNativeDrag(event);
  });

  function finishPress(event) {
    if (event.button !== undefined && event.button !== 0) return;
    if (!pressed) return;
    pressed = false;
    event.stopPropagation();
    // 拖动升级后松手：手势已被拖动消费，不再触发点击。
    if (dragArmed) return;
    // 单击（贴边或浮动）：Go 侧 BarToggle —— 贴边时弹回，浮动时开关宠物窗口。
    try {
      const pending = Bound.BarToggle();
      if (pending && typeof pending.catch === "function") pending.catch(function () {});
    } catch (_) {}
  }
  ball.addEventListener("pointerup", finishPress);
  ball.addEventListener("pointercancel", function () {
    pressed = false;
    dragArmed = false;
  });

  ball.addEventListener("contextmenu", function (event) {
    event.preventDefault();
    event.stopPropagation();
    try {
      const pending = Bound.BarMenu();
      if (pending && typeof pending.catch === "function") pending.catch(function () {});
    } catch (_) {}
  });
</script>
</body>
</html>
