<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<script>
  (function () {
    var theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark") {
      document.documentElement.dataset.theme = theme;
    }
  })();
</script>
<link rel="stylesheet" href="assets/qka-ui.css">
<style>
  /* 右键菜单：照 magpie 的 .row-menu —— 11px 圆角、4px 内边距、1px 行距、
     28px 行高、7px 行圆角；图标 13px、文字 12.5px，分隔线只做 1px。 */
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--card); overflow: hidden;
    -webkit-user-select: none; user-select: none;
    font: 400 12.5px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .menu {
    width: 100%; height: 100%;
    padding: 4px;
    display: grid; gap: 1px; align-content: start;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 16px 44px -14px rgba(0, 0, 0, .28);
  }
  .menu button {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: 28px; padding: 0 8px;
    border: 0; border-radius: 7px;
    background: none; color: var(--ink);
    font: inherit; font-size: 12.5px; text-align: left;
    cursor: default;
  }
  .menu button:hover,
  .menu button:focus-visible {
    background: var(--bg2);
    outline: none;
  }
  .menu button svg {
    width: 13px; height: 13px; flex: none;
    color: var(--ink3);
  }
  .menu button .label {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .menu .sep { height: 1px; margin: 3px 6px; background: var(--line2); }
  .menu .danger { color: var(--bad); }
  .menu .danger svg { color: currentColor; }
  .menu .danger:hover,
  .menu .danger:focus-visible { background: var(--bad-soft); color: var(--bad); }
</style>
</head>
<body>
  <div class="menu" role="menu" aria-label="Quota Keepalive 菜单">
    <button type="button" role="menuitem" data-action="main">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2.5" y="2.8" width="11" height="10.4" rx="2" stroke="currentColor" stroke-width="1.3"/>
        <path d="M2.5 6h11" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <span class="label">打开主界面</span>
    </button>
    <button type="button" role="menuitem" data-action="settings">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="8" cy="8" r="2.1" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.9v1.5M8 12.6v1.5M1.9 8h1.5M12.6 8h1.5M3.7 3.7l1.1 1.1M11.2 11.2l1.1 1.1M12.3 3.7l-1.1 1.1M4.8 11.2l-1.1 1.1"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span class="label">设置</span>
    </button>
    <div class="sep" role="separator"></div>
    <button type="button" role="menuitem" class="danger" data-action="quit">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 2.4v5.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M5.2 4.1a5.1 5.1 0 1 0 5.6 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="label">退出 Quota Keepalive</span>
    </button>
  </div>

<script type="module">
  import { Events } from "/wails/runtime.js";

  const actions = {
    main: "open-main",
    settings: "open-settings",
    quit: "quit",
  };
  document.querySelectorAll("button[data-action]").forEach(function (button) {
    button.addEventListener("click", function () {
      const name = actions[button.dataset.action];
      if (!name) return;
      try {
        Events.Emit(name);
      } catch (_) {}
    });
  });
  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    try {
      Events.Emit("collapse-ballmenu");
    } catch (_) {}
  });
</script>
</body>
</html>
