name: windows

# Windows 构建与冒烟测试。
# 覆盖范围（结论边界要看清）：
#   - 所有包与测试代码能在 Windows 编译（含 GUI/CLI 双架构）
#   - CLI 产物真实可执行：用法输出、doctor、task-run 空跑
#   - 便携包结构与 PE 子系统正确
#   - GUI 产物是真正的自包含单文件 exe：Bun/adapters/provider-plugins 内嵌
#     （-tags embeddedruntime + build/embedassets），并经 build/verifype 校验
#     .rsrc/图标/版本号/manifest。曾发生过「GUI 版但没嵌运行时」的 exe：
#     能弹安装向导，却在最后一步必然失败（issue #3 同类回归）。
# 不覆盖：完整单元测试（大量用例断言 POSIX 语义，见下方步骤注释）、
# WebView2 渲染、托盘、任务计划程序、更新替换——这些必须在 Windows 真机验收。

on:
  push:
    # 分支上也要跑：Go 版的默认分支还没切换，只在 main 触发等于永不运行。
    branches: ['**']
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'build/**'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/windows.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 不在这里运行完整单元测试：大量用例断言的是 POSIX 语义（0600 权限、
      # keychain/security、adapter.sh、osascript、/usr/bin/true），在 Windows 上
      # 必然失败且修法是把测试整体改造，收益不如在真机验收。这里做两件真正有
      # Windows 意义的事：所有测试代码必须能在 Windows 编译（防止 syscall 一类
      # 平台符号回归），以及构建产物必须能真实执行。
      - name: Compile every test binary for Windows
        shell: pwsh
        run: |
          $failed = @()
          foreach ($pkg in (go list ./...)) {
            $out = Join-Path $env:TEMP "testbin.exe"
            go test -c -o $out $pkg 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { $failed += $pkg }
          }
          if ($failed.Count -gt 0) {
            Write-Host "以下包的测试在 Windows 上无法编译:" -ForegroundColor Red
            $failed | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
            exit 1
          }
          Write-Host "全部包的测试二进制在 Windows 编译通过"

      - name: Vet
        shell: pwsh
        run: go vet ./...

      - name: Build CLI
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force -Path dist/build | Out-Null
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOOS = 'windows'
            $env:GOARCH = $arch
            $ldflags = "-X qka/internal/cli.Version=0.0.0-ci"
            go build -trimpath -ldflags $ldflags -o "dist/build/QKA-cli-windows-$arch.exe" ./cmd/qka
            if ($LASTEXITCODE -ne 0) { throw "CLI build failed for $arch" }
          }

      - name: Cache Bun download (shared with release builds)
        uses: actions/cache@v4
        with:
          # 与 scripts/build-windows-exe.sh 的缓存目录一致（Git Bash 的 $HOME/.cache）。
          # 命中后不再重复下载 2×53MB 的 Bun 包。
          path: ~/.cache/qka
          key: qka-bun-${{ runner.os }}-1.4.4-${{ hashFiles('scripts/build-windows-exe.sh') }}

      - name: Build GUI (self-contained, embedded runtime) and verify PE
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          # 版本号单一来源（issue #2）：仓库根 VERSION 文件；CI 产物加 -ci 后缀，
          # 避免和正式发行版混淆（脚本会把它规整成 x.y.z 的版本资源）。
          version="$(head -n1 VERSION | tr -d '\r' | tr -d '[:space:]')-ci"
          # 必须走发行脚本，不能自己拼 go build：GUI 版依赖内嵌运行时，
          # 漏掉 build/embedassets 或 -tags embeddedruntime 会产出「能弹安装
          # 向导、但在解压运行时一步必失败」的 exe（用户侧表现为安装失败）。
          # 脚本同时负责 go-winres、体积自检与 build/verifype。
          VERSION="$version" WIN_ARCH=all scripts/build-windows-exe.sh
          mkdir -p dist/build
          for arch in amd64 arm64; do
            cp "dist/QKA-$version-windows-$arch.exe" "dist/build/QKA-windows-$arch.exe"
          done

      - name: Stage portable package (amd64)
        shell: pwsh
        run: |
          $stage = 'dist/smoke/QKA-ci-windows-amd64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist/build/QKA-windows-amd64.exe "$stage/QKA.exe"
          Copy-Item dist/build/QKA-cli-windows-amd64.exe "$stage/QKA-cli.exe"
          Copy-Item -Recurse adapters "$stage/adapters"
          Copy-Item -Recurse provider-plugins "$stage/provider-plugins"
          Copy-Item packaging/windows/README.txt "$stage/README.txt"
          # bun.exe 在这层不打包：CI 里它只用于验证运行时存在性，真实发布包由
          # scripts/build-windows-exe.sh 用固定版本的 bun 内嵌。

      - name: Smoke test
        shell: pwsh
        run: |
          # bun.exe 不在 CI 包内，脚本第 5 步会跳过；其余检查照常执行。
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows-smoke.ps1 -PackageDir dist/smoke/QKA-ci-windows-amd64
        continue-on-error: false

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: qka-windows-ci
          path: dist/build/*.exe
          retention-days: 7
