name: macos

# macOS 单元测试闸门。
# 背景：windows.yml 只在 Windows 上跑 GUI 测试，而 GUI 里有平台分支（悬浮球
# 仅 Windows、菜单栏面板仅 macOS）。之前 `TestBallWindowOptionsKeepDragAndDockSizes`
# 在 macOS 上一直是红的，却没有任何 CI 会跑到——平台相关的断言必须自己跳过，
# 不能靠「没人跑」蒙混。这里在 macOS 上跑同一组 GUI/设置单测与前端用例，
# 并顺带守住 gofmt。
on:
  push:
    branches: ['**']
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/**'
      - 'scripts/**'
      - 'build/**'
      - 'internal/gui/frontend/**'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/macos.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # adapterhost / adapterwiring 的用例会真的拉起随包 Bun 运行时；runner
      # 默认没有 bun，先装与发行物一致的版本再跑全量单测。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      # Windows 专用的用例（安装探测、盘符 DSN 等）已按平台跳过；macOS 是
      # POSIX，整包跑得起，能覆盖 cli/app 里那些「只在 macOS 上会踩」的分支
      # （例如 GUI() 在零值 App 上起异步任务导致的胖 goroutine panic）。
      - name: Unit tests
        run: go test ./...

      - name: gofmt check
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Setup Node for JS tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend JS unit tests
        run: node --test internal/gui/frontend-js-tests/*.test.mjs

      # 内置中文字体是按界面实际用字做的子集（410KB），不是完整字库。
      # 界面文案新增汉字后必须重跑 scripts/subset-font.py，否则新字会回退到
      # 系统字体：不出方框，但字重与正文不一致，在 Windows 上尤其明显
      # （系统中文只有 400/700 两档，正是这个字体要解决的问题）。
      # 这条校验只比对「必需字符是否都被子集覆盖」，不改任何文件。
      - name: Font subset is up to date
        run: |
          python3 -m pip install --quiet fonttools brotli
          python3 scripts/subset-font.py --check
